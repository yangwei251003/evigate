[build-system]
requires = ["setuptools>=69"]
build-backend = "setuptools.build_meta"

[project]
name = "evigate"
version = "0.1.0"
description = "Evidence-gated research-agent orchestration validators"
requires-python = ">=3.12"
dependencies = ["PyYAML>=6.0"]

[project.scripts]
evigate = "evigate.cli:main"

[tool.pytest.ini_options]
pythonpath = ["src"]
addopts = "-ra"
testpaths = ["tests"]
asyncio_default_fixture_loop_scope = "function"

[tool.setuptools.packages.find]
where = ["src"]
